h2>\n      \u003clabel for=\"outFmt\">출력 형식\u003c/label>\n      \u003ctextarea id=\"outFmt\" class=\"fmt\" rows=\"1\" spellcheck=\"false\" autocomplete=\"off\">c-b-a\u003c/textarea>\n      \u003cdiv class=\"chips\" id=\"outVars\" aria-label=\"사용할 수 있는 변수\">\u003c/div>\n      \u003clabel for=\"outSep\">출력 구분자\u003c/label>\n      \u003cinput id=\"outSep\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n      \u003cdiv class=\"chips\" id=\"sepPresets\" aria-label=\"출력 구분자 빠른 선택\">\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\"\\n\" title=\"구분자를 이 글자로\">줄바꿈\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\", \" title=\"구분자를 이 글자로\">쉼표\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\",\\n\" title=\"구분자를 이 글자로\">쉼표 + 줄바꿈\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\"\\t\" title=\"구분자를 이 글자로\">탭\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\" \" title=\"구분자를 이 글자로\">공백\u003c/button>\n      \u003c/div>\n\n      \u003clabel for=\"sortKey\">정렬 기준\u003c/label>\n      \u003cdiv class=\"sortrow\">\n        \u003cselect id=\"sortKey\" aria-label=\"정렬 기준 변수\">\u003coption value=\"\">입력 순서\u003c/option>\u003c/select>\n        \u003cselect id=\"sortDir\" aria-label=\"정렬 방향\">\u003coption value=\"asc\">오름차순\u003c/option>\u003coption value=\"desc\">내림차순\u003c/option>\u003c/select>\n      \u003c/div>\n\n      \u003cbutton class=\"convert\" id=\"convert\" type=\"button\">변환\u003c/button>\n\n      \u003cdiv class=\"row\">\n        \u003clabel for=\"result\">결과\u003c/label>\n        \u003cbutton class=\"copy\" id=\"copy\" type=\"button\">복사\u003c/button>\n      \u003c/div>\n      \u003ctextarea id=\"result\" readonly spellcheck=\"false\">\u003c/textarea>\n      \u003cp id=\"status\" role=\"status\">\u003c/p>\n    \u003c/section>\n  \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"p-case\" role=\"tabpanel\" aria-labelledby=\"t-case\" hidden>\n    \u003csection class=\"panel\">\n      \u003ch2>단어 목록\u003c/h2>\n      \u003cdiv class=\"opts\">\n        \u003cdiv>\n          \u003clabel for=\"cDelim\" style=\"margin-top:0\">항목 구분자\u003c/label>\n          \u003cinput id=\"cDelim\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel for=\"cFmt\" style=\"margin-top:0\">항목 형식\u003c/label>\n          \u003cinput id=\"cFmt\" value=\"{한글} {영어}\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003c/div>\n      \u003c/div>\n      \u003clabel for=\"cData\">목록\u003c/label>\n      \u003ctextarea id=\"cData\" spellcheck=\"false\">테이블 이름 TABLE_NAME\n사용자 이름 user_name\n주문 번호 OrderNo\n생성 일시 createdAt\u003c/textarea>\n      \u003cul class=\"issues\" id=\"cIssues\">\u003c/ul>\n    \u003c/section>\n\n    \u003csection class=\"panel stack\" id=\"cPanel\">\n      \u003cdiv class=\"head\">\n        \u003ch2>케이스 표\u003c/h2>\n        \u003cdiv class=\"head-tools\">\n          \u003cdiv class=\"fullonly\">\n            \u003cinput id=\"cSearch\" class=\"search\" type=\"search\" placeholder=\"한글·영어·케이스로 검색\" autocomplete=\"off\" spellcheck=\"false\">\n            \u003cspan class=\"match\" id=\"cMatch\" role=\"status\">\u003c/span>\n            \u003cdiv class=\"bmwrap\">\n              \u003cbutton class=\"mini\" id=\"cBm\" type=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\">북마크 (0)\u003c/button>\n              \u003cdiv class=\"bm-pop\" id=\"bmPop\" hidden>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cbutton class=\"mini\" id=\"cFull\" type=\"button\">전체 보기\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"copybar\">\n        \u003cdiv class=\"opts\">\n          \u003cdiv>\n            \u003clabel for=\"cJoin\">복사 구분자\u003c/label>\n            \u003cinput id=\"cJoin\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel for=\"cTpl\">여러 케이스 복사 형식\u003c/label>\n            \u003cinput id=\"cTpl\" value=\"{어퍼케이스}, {파스칼케이스} AS {한글명}\" spellcheck=\"false\" autocomplete=\"off\">\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"chips\" id=\"cTplChips\" aria-label=\"복사 형식에 넣을 수 있는 열\">\u003c/div>\n        \u003cp class=\"hint\" id=\"cPreview\">\u003c/p>\n        \u003cdiv class=\"th-btns\">\n          \u003cbutton class=\"mini\" id=\"tplAll\" type=\"button\">형식으로 전체 복사\u003c/button>\n          \u003cbutton class=\"mini\" id=\"tplSel\" type=\"button\">형식으로 선택 복사\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"tablewrap\">\u003ctable id=\"cTable\">\u003c/table>\u003c/div>\n      \u003cp class=\"status\" id=\"cStatus\" role=\"status\">\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv id=\"p-merge\" role=\"tabpanel\" aria-labelledby=\"t-merge\" hidden>\n    \u003csection class=\"panel\">\n      \u003ch2>목록\u003c/h2>\n      \u003cdiv class=\"opts\">\n        \u003cdiv>\n          \u003clabel for=\"mDelim\" style=\"margin-top:0\">항목 구분자\u003c/label>\n          \u003cinput id=\"mDelim\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003c/div>\n        \u003c/div>\n      \u003cdiv class=\"pair\" id=\"mLists\">\u003c/div>\n      \u003cdiv class=\"condbar\">\n        \u003cbutton class=\"mini\" id=\"mAdd\" type=\"button\">+ 목록 추가\u003c/button>\n      \u003c/div>\n      \u003clabel class=\"inline\" for=\"mTrim\">\u003cinput type=\"checkbox\" id=\"mTrim\" checked> 각 항목의 앞뒤 공백 제거\u003c/label>\n    \u003c/section>\n\n    \u003csection class=\"panel stack\">\n      \u003ch2>합치기\u003c/h2>\n      \u003clabel for=\"mFmt\" style=\"margin-top:0\">출력 형식\u003c/label>\n      \u003cinput id=\"mFmt\" value=\"{A}: {B}\" spellcheck=\"false\" autocomplete=\"off\">\n      \u003cdiv class=\"chips\" id=\"mVars\" aria-label=\"출력 형식에 넣을 수 있는 변수\">\u003c/div>\n      \u003clabel for=\"mSep\">출력 구분자\u003c/label>\n      \u003cinput id=\"mSep\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n      \u003cdiv class=\"chips\" id=\"mSepPresets\" aria-label=\"출력 구분자 빠른 선택\">\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\"\\n\" title=\"구분자를 이 글자로\">줄바꿈\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\", \" title=\"구분자를 이 글자로\">쉼표\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\",\\n\" title=\"구분자를 이 글자로\">쉼표 + 줄바꿈\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\"\\t\" title=\"구분자를 이 글자로\">탭\u003c/button>\n        \u003cbutton class=\"chip\" type=\"button\" data-sep=\" \" title=\"구분자를 이 글자로\">공백\u003c/button>\n      \u003c/div>\n\n      \u003clabel>줄 수가 다를 때\u003c/label>\n      \u003cdiv class=\"radiorow\">\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"mMode\" value=\"long\" checked> 긴 쪽에 맞추기 (모자란 쪽은 빈 값)\u003c/label>\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"mMode\" value=\"repeat\"> 긴 쪽에 맞추기 (모자란 쪽은 반복으로 채움)\u003c/label>\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"mMode\" value=\"short\"> 짧은 쪽에 맞추기 (남는 줄은 버림)\u003c/label>\n      \u003c/div>\n      \u003cul class=\"issues\" id=\"mIssues\">\u003c/ul>\n\n      \u003cdiv class=\"row\">\n        \u003clabel for=\"mResult\">결과\u003c/label>\n        \u003cbutton class=\"copy\" id=\"mCopy\" type=\"button\">복사\u003c/button>\n      \u003c/div>\n      \u003ctextarea id=\"mResult\" readonly spellcheck=\"false\">\u003c/textarea>\n      \u003cp class=\"status\" id=\"mStatus\" role=\"status\">\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv id=\"p-mat\" role=\"tabpanel\" aria-labelledby=\"t-mat\" hidden>\n    \u003cdiv class=\"grid\">\n      \u003csection class=\"panel\">\n        \u003ch2>입력\u003c/h2>\n        \u003clabel for=\"xRows\" style=\"margin-top:0\">묶음 줄 수\u003c/label>\n        \u003cinput id=\"xRows\" type=\"number\" min=\"1\" max=\"20\" value=\"2\" style=\"width:6rem\">\n        \u003clabel>줄별 구분자 \u003cspan class=\"sub\">(묶음 안의 위치마다 하나씩, 묶음이 반복되면 같은 설정을 다시 써요)\u003c/span>\u003c/label>\n        \u003cdiv class=\"tablewrap\">\u003ctable id=\"xCfg\">\u003c/table>\u003c/div>\n        \u003cdiv class=\"condbar\">\n          \u003cbutton class=\"mini\" id=\"xCfgAll\" type=\"button\">첫 줄 설정을 모든 줄에 적용\u003c/button>\n        \u003c/div>\n        \u003cp class=\"hint\" id=\"xHint\">\u003c/p>\n        \u003clabel for=\"xData\">데이터\u003c/label>\n        \u003ctextarea id=\"xData\" wrap=\"off\" spellcheck=\"false\">a  b  c\n1  2  3\u003c/textarea>\n      \u003c/section>\n      \u003csection class=\"panel\">\n        \u003ch2>출력\u003c/h2>\n        \u003clabel style=\"margin-top:0\">변환 방식\u003c/label>\n        \u003cdiv class=\"radiorow\">\n          \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"xMode\" value=\"pivot\" checked> 열끼리 모아 재배열\u003c/label>\n          \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"xMode\" value=\"line\"> 줄마다 따로 변환\u003c/label>\n        \u003c/div>\n        \u003cdiv id=\"xFmtBox\">\n          \u003clabel for=\"xFmt\">출력 형식\u003c/label>\n          \u003cinput id=\"xFmt\" value=\"{1} {2}\" spellcheck=\"false\" autocomplete=\"off\">\n          \u003cdiv class=\"chips\" id=\"xVars\" aria-label=\"출력 형식에 넣을 수 있는 변수\">\u003c/div>\n        \u003c/div>\n        \u003clabel for=\"xSep\" id=\"xSepLabel\">출력 구분자\u003c/label>\n        \u003cinput id=\"xSep\" value=\"\\n\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003cdiv class=\"chips\" id=\"xSepPresets\" aria-label=\"출력 구분자 빠른 선택\">\u003c/div>\n        \u003cdiv class=\"row\">\n          \u003clabel for=\"xResult\">결과\u003c/label>\n          \u003cbutton class=\"copy\" id=\"xCopy\" type=\"button\">복사\u003c/button>\n        \u003c/div>\n        \u003ctextarea id=\"xResult\" readonly spellcheck=\"false\">\u003c/textarea>\n        \u003cul class=\"issues\" id=\"xIssues\">\u003c/ul>\n        \u003cp class=\"status\" id=\"xStatus\" role=\"status\">\u003c/p>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"p-find\" role=\"tabpanel\" aria-labelledby=\"t-find\" hidden>\n    \u003csection class=\"panel\">\n      \u003cdiv class=\"head\">\n        \u003ch2>텍스트\u003c/h2>\n        \u003cdiv class=\"head-tools\">\n          \u003cspan class=\"match\" id=\"fLen\">\u003c/span>\n          \u003cbutton class=\"mini\" id=\"fUndo\" type=\"button\" disabled>되돌리기\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003ctextarea id=\"fText\" spellcheck=\"false\">- 안녕하세요 박가은 입니다.\n- 안녕하세요 사람 입니다.\n- 안녕하세요\u003c/textarea>\n      \u003c/section>\n\n    \u003csection class=\"panel stack\">\n      \u003ch2>찾기 · 바꾸기\u003c/h2>\n      \u003cdiv class=\"rulebar\">\n        \u003cdiv class=\"rules\" id=\"fRules\" aria-label=\"바꾸기 규칙 목록\">\u003c/div>\n        \u003cbutton class=\"mini primary\" id=\"fRuleAdd\" type=\"button\">+ 규칙 추가\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"rulebar\">\n        \u003clabel class=\"inline\" for=\"fRuleOn\">\u003cinput type=\"checkbox\" id=\"fRuleOn\" checked> 이 규칙 사용\u003c/label>\n        \u003cbutton class=\"mini\" id=\"fRuleUp\" type=\"button\">← 앞으로\u003c/button>\n        \u003cbutton class=\"mini\" id=\"fRuleDown\" type=\"button\">뒤로 →\u003c/button>\n        \u003cbutton class=\"mini\" id=\"fRuleDel\" type=\"button\">이 규칙 삭제\u003c/button>\n        \u003cspan class=\"sub\">규칙은 앞에서부터 차례로 적용돼요 (앞 규칙으로 바뀐 글에 다음 규칙을 적용)\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"grid\">\n        \u003cdiv>\n          \u003clabel for=\"fFind\" style=\"margin-top:0\">찾을 내용\u003c/label>\n          \u003cinput id=\"fFind\" value=\"안녕하세요 {a} 입니다.\" spellcheck=\"false\" autocomplete=\"off\">\n          \u003cdiv class=\"chips\" id=\"fVars\" aria-label=\"인식된 변수\">\u003c/div>\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel for=\"fRep\" style=\"margin-top:0\">바꿀 내용\u003c/label>\n          \u003cinput id=\"fRep\" value=\"안녕하세요 {a >\n          \u003cdiv class=\"condbar\">\u003cbutton class=\"mini\" id=\"rBulkBtn\" type=\"button\">붙여넣은 컬럼 추가\u003c/button>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"hint\">이 브라우저에 저장돼요.\u003c/p>\n      \u003c/div>\n    \u003c/dialog>\n  \u003c/div>\n  \u003cdiv id=\"p-mock\" role=\"tabpanel\" aria-labelledby=\"t-mock\" hidden>\n    \u003csection class=\"panel\">\n      \u003ch2>테이블·컬럼\u003c/h2>\n      \u003cdiv class=\"pair\">\n        \u003cdiv>\u003clabel for=\"kDb\">DB 종류\u003c/label>\u003cselect id=\"kDb\" class=\"qsel\">\u003c/select>\u003c/div>\n        \u003cdiv>\u003clabel for=\"kTbl\">테이블명\u003c/label>\u003cinput id=\"kTbl\" value=\"TB_USER\" spellcheck=\"false\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"kKo\">테이블 한글명 (주석)\u003c/label>\u003cinput id=\"kKo\" value=\"사용자\" spellcheck=\"false\" autocomplete=\"off\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"kN\">생성 건수 (최대 1000)\u003c/label>\u003cinput id=\"kN\" type=\"number\" min=\"1\" max=\"1000\" value=\"5\">\u003c/div>\n        \u003cdiv>\u003clabel for=\"kReg\">등록한 테이블 불러오기\u003c/label>\u003cselect id=\"kReg\" class=\"qsel\">\u003c/select>\u003c/div>\n      \u003c/div>\n      \u003clabel>컬럼\u003c/label>\n      \u003cdiv class=\"tablewrap\">\u003ctable id=\"kCols\">\u003c/table>\u003c/div>\n      \u003cdatalist id=\"kFmts\">\n        \u003coption value=\"YYYY-MM-DD\">\u003c/option>\u003coption value=\"YYYYMMDD\">\u003c/option>\u003coption value=\"YYYY.MM.DD\">\u003c/option>\u003coption value=\"YYYY/MM/DD\">\u003c/option>\n        \u003coption value=\"YYYY-MM-DD HH24:MI:SS\">\u003c/option>\u003coption value=\"YYYYMMDDHH24MISS\">\u003c/option>\u003coption value=\"yyyy-MM-dd HH:mm:ss\">\u003c/option>\u003coption value=\"HH24:MI:SS\">\u003c/option>\n      \u003c/datalist>\n      \u003cdiv class=\"condbar\">\u003cbutton class=\"mini\" id=\"kAdd\" type=\"button\">+ 컬럼 추가\u003c/button>\u003cbutton class=\"mini\" id=\"kClear\" type=\"button\">컬럼 전체 삭제\u003c/button>\u003c/div>\n      \u003clabel for=\"kBulk\">여러 줄 붙여넣기 (한 줄에 컬럼명 한글명 종류 설정)\u003c/label>\n      \u003ctextarea id=\"kBulk\" wrap=\"off\" spellcheck=\"false\" placeholder=\"USER_ID 사용자ID s 1,1,5&#10;USER_NM 사용자명 kn&#10;AGE 나이 i 20,60&#10;GRADE 등급 p A,B,C&#10;REG_DT 등록일자 d 2026-01-01,2026-12-31 YYYYMMDD\">\u003c/textarea>\n      \u003cdiv class=\"condbar\">\n        \u003cbutton class=\"mini\" id=\"kBulkBtn\" type=\"button\">붙여넣은 컬럼 추가\u003c/button>\n        \u003cbutton class=\"mini\" id=\"kGuideBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"kGuide\">입력 가이드\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"qd\" id=\"kGuide\" hidden>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"panel stack\">\n      \u003ch2>출력\u003c/h2>\n      \u003cdiv class=\"radiorow\">\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"kMode\" value=\"insert\" checked> INSERT\u003c/label>\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"kMode\" value=\"update\"> UPDATE\u003c/label>\n        \u003clabel class=\"inline\">\u003cinput type=\"radio\" name=\"kMode\" value=\"custom\"> 사용자 지정 형식\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"pair\" id=\"kCmBox\">\n        \u003cdiv>\u003clabel class=\"inline\" for=\"kCm\">\u003cinput type=\"checkbox\" id=\"kCm\" checked> 한글 주석 달기\u003c/label>\u003c/div>\n        \u003cdiv>\u003cselect id=\"kCmT\" class=\"qsel\" aria-label=\"주석 형식\">\u003c/select>\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"kCustom\" hidden>\n        \u003clabel for=\"kT1\">행 시작\u003c/label>\u003cinput id=\"kT1\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003clabel for=\"kT2\">컬럼마다 한 줄\u003c/label>\u003cinput id=\"kT2\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003clabel for=\"kT3\">행 끝\u003c/label>\u003cinput id=\"kT3\" spellcheck=\"false\" autocomplete=\"off\">\n        \u003cdiv class=\"chips\" id=\"kChips\" aria-label=\"형식에 넣을 수 있는 변수\">\u003c/div>\n        \u003cp class=\"hint\">{값}은 값 그대로, {SQL값}은 따옴표·함수까지 SQL 형식이에요. 컬럼 변수는 컬럼마다 한 줄에서만 쓰여요. \\n은 줄바꿈이에요.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003clabel for=\"kOut\">결과\u003c/label>\n        \u003cspan style=\"display:flex;gap:.4rem;margin-bottom:.35rem\">\u003cbutton class=\"copy\" id=\"kRe\" type=\"button\" style=\"margin:0\">다시 생성\u003c/button>\u003cbutton class=\"copy\" id=\"kCopy\" type=\"button\" style=\"margin:0\">복사\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003ctextarea id=\"kOut\" readonly wrap=\"off\" spellcheck=\"false\">\u003c/textarea>\n      \u003cul class=\"issues\" id=\"kIssues\">\u003c/ul>\n      \u003cp class=\"status\" id=\"kStatus\" role=\"status\">\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>\n\n\u003cscript>\nconst $ = id => document.getElementById(id);\nconst HUES = [215, 150, 25, 330, 265, 190, 45, 0];\nconst esc = s => s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\nconst short = s => s.length > 30 ? s.slice(0, 30) + '…' : s;\nconst unesc = s => s.replace(/\\\\n/g, '\\n').replace(/\\\\t/g, '\\t');\nconst h = (tag, props = {}, ...kids) => {\n  const e = Object.assign(document.createElement(tag), props);\n  e.append(...kids);\n  return e;\n};\nconst pad = (n, l = 2) => String(n).padStart(l, '0');\nconst NUMT = t => /^(숫자|num|number|digits?)$/i.test(t || '');\nconst isoLocal = (d = new Date()) => {\n  const o = -d.getTimezoneOffset(), a = Math.abs(o);\n  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +\n    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +\n    (o >= 0 ? '+' : '-') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);\n};\nconst stamp = (d = new Date()) =>\n  d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' +\n  pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());\nconst hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());\nconst json = o => JSON.stringify(o, null, 2) + '\\n';\n\n// 확인 대화상자는 이 화면에서 뜨지 않아서, 같은 단추를 한 번 더 눌러야 실행되게 한다\nfunction armed(btn, label) {\n  if (btn._armed) { clearTimeout(btn._armT); btn._armed = false; btn.textContent = btn._armTxt; return true; }\n  btn._armed = true; btn._armTxt = btn.textContent; btn.textContent = label;\n  btn._armT = setTimeout(() => { btn._armed = false; btn.textContent = btn._armTxt; }, 3500);\n  return false;\n}\n\nconst store = { saveData: false };\nfunction markDirty() {}\nlet currentTab = 'fmt';\nlet terms = [];\nconst grave = new Map();\nconst checked = new Set();\nlet rows = [], trEls = [], hasKo = false;\n\n// ───────── 형식 변환 탭 ─────────\n// \"a,b,c\" → 변수 [a,b,c] 와 그 사이의 구분 글자들\n// \"{A} AS {B}\" 처럼 {변수}가 하나라도 있으면 중괄호 안만 변수, 나머지(AS 등)는 고정 글자로 본다\nfunction parseFormat(fmt) {\n  const vars = [], lits = [], types = [];\n  const braced = /\\{[\\p{L}\\p{N}_]+(?::[^{}]*)?\\}/u.test(fmt);\n  const re = braced ? /\\{([\\p{L}\\p{N}_]+)(?::([^{}]*))?\\}/gu : /[\\p{L}\\p{N}_]+/gu;\n  let last = 0, m;\n  while ((m = re.exec(fmt))) {\n    lits.push(fmt.slice(last, m.index));\n    vars.push(braced ? m[1] : m[0]); types.push(braced ? (m[2] || '').trim() : '');\n    last = m.index + m[0].length;\n  }\n  lits.push(fmt.slice(last));\n  return { vars, lits, types };\n}\n\n// 구분 글자 주변의 공백은 있어도 없어도 되게 만든다\n// 단, AS 처럼 글자로 시작·끝나는 구분 글자가 공백으로 띄워져 있으면 그 공백은 꼭 있어야 한다 (BASE 속 AS를 구분자로 오인하지 않도록)\nfunction buildRegex({ vars, lits, types = [] }) {\n  const wordCh = /[\\p{L}\\p{N}_]/u;\n  let src = '^\\\\s*';\n  lits.forEach((rawLit, i) => {\n    const edge = i === 0 || i === lits.length - 1;\n    // 맨 앞·맨 뒤 구분 글자의 바깥 공백(줄바꿈 포함)은 무시한다\n    let lit = rawLit;\n    if (i === 0) lit = lit.replace(/^\\s+/, '');\n    if (i === lits.length - 1) lit = lit.replace(/\\s+$/, '');\n    if (lit.includes('\\n')) {\n      // 형식에 줄바꿈이 있으면 데이터도 그 자리에서 줄이 바뀌어야 한다 (사이의 빈 줄·들여쓰기는 허용)\n      const segs = lit.replace(/\\s*\\r?\\n\\s*/g, '\\n').split('\\n').map(s => s.trim());\n      src += '[ \\\\t]*' + segs.map(esc).join('[ \\\\t]*\\\\r?\\\\n\\\\s*') + '[ \\\\t]*';\n    } else {\n      const core = lit.trim();\n      if (core) {\n        const needL = i > 0 && /^\\s/.test(lit) && wordCh.test(core[0]);\n        const needR = i \u003c lits.length - 1 && /\\s$/.test(lit) && wordCh.test(core[core.length - 1]);\n        src += (needL ? '\\\\s+' : '\\\\s*') + esc(core) + (needR ? '\\\\s+' : '\\\\s*');\n      }\n      else if (lit && !edge) src += '\\\\s+';\n    }\n    if (i \u003c vars.length) src += NUMT(types[i]) ? '(\\\\d+)' : '(.*?)';\n  });\n  return new RegExp(src + '\\\\s*$', 'i');\n}\n\nfunction render(tpl, row) {\n  return tpl.replace(/\\\\([nt])|\\{([^{}]+)\\}|[\\p{L}\\p{N}_]+/gu, (m, bs, brace) => {\n    if (bs) return bs === 'n' ? '\\n' : '\\t';\n    const key = brace !== undefined ? brace : m;\n    return key in row ? row[key] : m;\n  });\n}\n\nfunction drawChips(el, vars, clickable) {\n  if (!vars.length) {\n    const s = document.createElement('span');\n    s.className = 'none';\n    s.textContent = '';\n    el.replaceChildren(s);\n    return;\n  }\n  el.replaceChildren(...vars.map((v, i) => {\n    const c = document.createElement(clickable ? 'button' : 'span');\n    c.className = 'chip';\n    c.style.setProperty('--h', HUES[i % HUES.length]);\n    c.textContent = v;\n    if (clickable) {\n      c.type = 'button';\n      c.title = '출력 형식에 넣기';\n      c.onclick = () => {\n        const o = $('outFmt');\n        const s = o.selectionStart ?? o.value.length;\n        const e = o.selectionEnd ?? s;\n        o.setRangeText('{' + v + '}', s, e, 'end');\n        o.focus();\n        markDirty();\n      };\n    }\n    return c;\n  }));\n}\n\n// 입력 형식을 고치면 변수 칩과 입력 예시(placeholder)만 바로 갱신한다\nfunction refreshFormat() {\n  const fmt = parseFormat($('inFmt').value);\n  drawChips($('inVars'), fmt.vars, false);\n  drawChips($('outVars'), fmt.vars, true);\n  const sk = $('sortKey'), cur = sk.value;\n  sk.replaceChildren(h('option', { value: '', textContent: '입력 순서' }), ...fmt.vars.map(v => h('option', { value: v, textContent: v })));\n  sk.value = fmt.vars.includes(cur) ? cur : '';\n  $('data').placeholder = fmt.vars.length\n    ? fmt.lits.map((l, i) => l + (i \u003c fmt.vars.length ? fmt.vars[i] + '1' : '')).join('')\n    : '';\n}\n\n// 변환 버튼을 눌렀을 때 결과를 만든다\nfunction convert() {\n  const fmt = parseFormat($('inFmt').value);\n  const issues = $('issues');\n  const result = $('result');\n  const status = $('status');\n  issues.replaceChildren();\n\n  const addIssue = text => {\n    const li = document.createElement('li');\n    li.textContent = text;\n    issues.append(li);\n  };\n\n  const dup = fmt.vars.filter((v, i) => fmt.vars.indexOf(v) !== i);\n  if (!fmt.vars.length || dup.length) {\n    result.value = '';\n    status.textContent = '';\n    addIssue(!fmt.vars.length\n      ? '입력 형식에 변수가 없어요. a,b,c 또는 {A} AS {B} 처럼 변수 이름을 적어 주세요.'\n      : '변수 이름이 겹쳐요: ' + [...new Set(dup)].join(', ') + '. 서로 다른 이름을 써 주세요.');\n    return;\n  }\n\n  const rx = buildRegex(fmt);\n  const tpl = $('outFmt').value;\n  const sep = unesc($('outSep').value) || '\\n';\n  const recs = [], bad = [];\n  // 입력 형식이 N줄이면 데이터도 (빈 줄을 뺀) N줄씩 묶어서 한 건으로 읽는다\n  const per = Math.max(1, $('inFmt').value.split(/\\r?\\n/).filter(s => s.trim()).length);\n  const lines = [];\n  $('data').value.split(/\\r?\\n/).forEach((line, i) => { if (line.trim()) lines.push([i + 1, line]); });\n  for (let s = 0; s \u003c lines.length; s += per) {\n    const chunk = lines.slice(s, s + per);\n    const text = chunk.map(x => x[1]).join('\\n');\n    const m = rx.exec(text);\n    if (!m) { bad.push([chunk[0][0], text.trim().replace(/\\s*\\n\\s*/g, ' ↵ ')]); continue; }\n    const row = Object.create(null);\n    fmt.vars.forEach((v, k) => { row[v] = m[k + 1].trim(); });\n    recs.push(row);\n  }\n\n  const key = fmt.vars.includes($('sortKey').value) ? $('sortKey').value : '', desc = $('sortDir').value === 'desc';\n  if (key) recs.sort((a, b) => a[key].localeCompare(b[key], 'ko', { numeric: true, sensitivity: 'base' }) * (desc ? -1 : 1));\n  else if (desc) recs.reverse();\n  const out = recs.map(r => render(tpl, r));\n  result.value = out.join(sep);\n  bad.slice(0, 5).forEach(([n, line]) =>\n    addIssue(n + '번째 줄' + (per > 1 ? '부터의 ' + per + '줄' : '') + ' “' + short(line) + '”은(는) 입력 형식과 맞지 않아요.'));\n  if (bad.length > 5) addIssue('그 밖에 ' + (bad.length - 5) + '건이 더 맞지 않아요.');\n\n  status.textContent = !tpl.trim()\n    ? '출력 형식을 입력하면 결과가 나와요.'\n    : out.length + '건 변환' + (bad.length ? ' · ' + bad.length + '건 건너뜀' : '');\n}\n\n$('copy').addEventListener('click', async () => {\n  const text = $('result').value;\n  try {\n    await navigator.clipboard.writeText(text);\n  } catch {\n    $('result').select();\n    document.execCommand('copy');\n  }\n  const b = $('copy');\n  b.textContent = '복사됨';\n  setTimeout(() => { b.textContent = '복사'; }, 1500);\n});\n\n// 출력 구분자 빠른 선택\nfunction syncSepChips() {\n  const v = $('outSep').value;\n  document.querySelectorAll('#sepPresets .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sep === v)));\n}\ndocument.querySelectorAll('#sepPresets .chip').forEach((b, i) => {\n  b.style.setProperty('--h', HUES[i % HUES.length]);\n  b.onclick = () => { $('outSep').value = b.dataset.sep; syncSepChips(); convert(); markDirty(); };\n});\n$('outSep').addEventListener('input', () => { syncSepChips(); markDirty(); });\n\n$('inFmt').addEventListener('input', refreshFormat);\n$('convert').addEventListener('click', convert);\n$('sortKey').addEventListener('change', convert);\n$('sortDir').addEventListener('change', convert);\n['inFmt', 'outFmt', 'outSep'].forEach(id => {\n  $(id).addEventListener('keydown', e => {\n    if (e.key !== 'Enter') return;\n    // 형식 칸은 여러 줄이라 Enter는 줄바꿈, Ctrl/⌘+Enter가 변환\n    if (id === 'outSep' || e.ctrlKey || e.metaKey) { e.preventDefault(); convert(); }\n  });\n  if (id !== 'outSep') $(id).addEventListener('input', markDirty);\n});\n\n// 형식 칸은 줄 수에 맞춰 높이가 늘고 줄어든다 (숨겨진 탭에서는 잴 수 없으니 건너뜀)\nconst fitFmt = el => {\n  if (!el.offsetParent) return;\n  el.style.height = 'auto';\n  el.style.height = (el.scrollHeight + el.offsetHeight - el.clientHeight) + 'px';\n};\nconst fitAllFmt = () => ['inFmt', 'outFmt'].forEach(id => fitFmt($(id)));\n['inFmt', 'outFmt'].forEach(id => $(id).addEventListener('input', () => fitFmt($(id))));\nwindow.addEventListener('resize', fitAllFmt);\n$('data').addEventListener('input', () => { if (store.saveData) markDirty(); });\n\n// ───────── 탭 전환 ─────────\nfunction setTab(name) {\n  currentTab = name;\n  document.querySelectorAll('.tab').forEach(b => {\n    const on = b.id === 't-' + name;\n    b.setAttribute('aria-selected', on);\n    $(b.getAttribute('aria-controls')).hidden = !on;\n  });\n  if (name === 'fmt') fitAllFmt();\n}\ndocument.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {\n  setTab(t.id.slice(2));\n  markDirty();\n}));\n\n// ───────── 케이스 변환 탭 ─────────\nconst NOKO = '[^\\\\u3131-\\\\u318E\\\\uAC00-\\\\uD7A3]';           // 한글이 아닌 글자\nconst cap = s => s[0].toUpperCase() + s.slice(1);\nconst CASES = [\n  { key: 'upper',  name: '어퍼케이스',     eg: 'TABLE_NAME', fn: w => w.join('_').toUpperCase() },\n  { key: 'pascal', name: '파스칼케이스',   eg: 'TableName',  fn: w => w.map(cap).join('') },\n  { key: 'camel',  name: '카멜케이스',     eg: 'tableName',  fn: w => w.map((x, i) => i ? cap(x) : x).join('') },\n  { key: 'snake',  name: '스네이크케이스', eg: 'table_name', fn: w => w.join('_') },\n];\n\n// \"{한글} {영어}\" → 순서대로 [한글, 영어] 와 그 사이 구분 글자\nfunction parseEntryFormat(f) {\n  f = f.trim() || '{영어}';\n  const re = /\\{(한글|영어)\\}/g, keys = [], lits = [];\n  let last = 0, m;\n  while ((m = re.exec(f))) { lits.push(f.slice(last, m.index)); keys.push(m[1]); last = m.index + m[0].length; }\n  lits.push(f.slice(last));\n  return { keys, lits };\n}\n\nfunction entryRegex({ keys, lits }) {\n  let src = '^\\\\s*';\n  lits.forEach((l, i) => {\n    const core = l.trim(), edge = i === 0 || i === lits.length - 1;\n    if (core) src += '\\\\s*' + esc(core) + '\\\\s*' ('.bmwrap')) closePop(); });\n\n// 표를 화면 가득 크게 보기\nfunction setFull(on) {\n  $('cPanel').classList.toggle('full', on);\n  document.body.classList.toggle('lock', on);\n  $('cFull').textContent = on ? '닫기' : '전체 보기';\n  if (!on) { $('cSearch').value = ''; applySearch(); closePop(); }\n}\n$('cFull').addEventListener('click', () => setFull(!$('cPanel').classList.contains('full')));\ndocument.addEventListener('keydown', e => {\n  if (e.key !== 'Escape') return;\n  if (document.querySelector('dialog[open]')) return;   // 대화상자는 스스로 닫힌다\n  if (!$('bmPop').hidden) closePop();\n  else if ($('cPanel').classList.contains('full')) setFull(false);\n});\n\n['cDelim', 'cFmt', 'cData'].forEach(id => $(id).addEventListener('input', () => { caseUpdate(); markDirty(); }));\n\n// ───────── 목록 합치기 탭 ─────────\n// 목록 A, B, C …를 같은 번호(순서)끼리 짝지어서 출력 형식대로 이어 붙인다.\nfunction mergeMode() { return document.querySelector('input[name=mMode]:checked').value; }\n\n// 목록 글 → 항목 배열. 끝에 이어진 빈 항목은 줄 수에 세지 않는다 (중간의 빈 항목은 번호를 맞추려고 그대로 둔다)\nfunction splitList(text, delim, trim) {\n  const items = text.split(delim).map(x => trim ? x.trim() : x);\n  while (items.length && !items[items.length - 1].trim()) items.pop();\n  return items;\n}\n\n// {목록 이름} … {번호}를 값으로 바꾸고 \\n \\t는 줄바꿈·탭으로 바꾼다. 없는 목록 이름은 그대로 두고, 값 속의 글자는 다시 해석하지 않는다\nfunction mergeRender(tpl, row) {\n  return tpl.replace(/\\\\([nt])|\\{([\\p{L}\\p{N}_]+)\\}/gu, (m, bs, key) => {\n    if (bs) return bs === 'n' ? '\\n' : '\\t';\n    const k = key.toLowerCase();\n    return k in row ? row[k] : m;\n  });\n}\n\n// 목록 이름(A, B, C …)은 화면에 보이는 순서대로 붙는다. 아무 목록이나 지우거나 옮기면 이름이 순서에 맞게 다시 붙는다.\nconst M_MIN = 2, M_MAX = 26;\nconst mLists = [];                    // [{ name, ta, cnt, box, title, up, down, del }]\n// 목록 이름은 목록마다 따로 갖고 있어서 순서를 바꿔도 그대로다. 새 목록은 안 쓰는 첫 글자(A, B, C …)를 받고, 제목을 더블클릭하면 바꿀 수 있다.\nconst M_NAME_RE = /^[\\p{L}\\p{N}_]+$/u;\nfunction mNextName() {\n  const used = new Set(mLists.map(l => l.name.toLowerCase()));\n  for (let i = 0; i \u003c 26; i++) { const c = String.fromCharCode(65 + i); if (!used.has(c.toLowerCase())) return c; }\n  let n = mLists.length + 1;\n  while (used.has('l' + n)) n++;\n  return 'L' + n;\n}\nlet mSeq = 0;\nlet mDrag = null;\nconst mClearOver = () => $('mLists').querySelectorAll('.over-l,.over-r').forEach(x => x.classList.remove('over-l', 'over-r'));\n\nfunction mAdd(value = '', name = mNextName()) {\n  const cnt = h('span', { className: 'sub' });\n  const title = h('span', { className: 'ltitle', title: '더블클릭: 이름 바꾸기', tabIndex: 0 });\n  const del = h('button', { className: 'mini', type: 'button', textContent: '삭제', title: '이 목록 삭제' });\n  const head = h('div', { className: 'lhead', draggable: true, title: '드래그해서 목록 순서 바꾸기' },\n    h('label', { htmlFor: 'mL' + (mSeq + 1) }, title, ' ', cnt), del);\n  const ta = h('textarea', { id: 'mL' + (++mSeq), value, spellcheck: false });\n  ta.wrap = 'off';\n  const box = h('div', {},\n    head,\n    ta);\n  const item = { name, ta, cnt, box, title, del, head };\n  mLists.push(item);\n  $('mLists').append(box);\n  del.onclick = () => mRemove(item);\n  title.ondblclick = () => mEditName(item);\n  title.onkeydown = e => { if (e.key === 'F2' || e.key === 'Enter') { e.preventDefault(); mEditName(item); } };\n\n  // 목록 제목줄을 잡고 끌어서 순서를 바꾼다 (케이스 표의 열 이동과 같은 방식: 대상의 왼쪽 절반이면 앞, 오른쪽 절반이면 뒤)\n  const rightHalf = e => { const r = box.getBoundingClientRect(); return e.clientX > r.left + r.width / 2; };\n  head.ondragstart = e => {\n    mDrag = item;\n    e.dataTransfer.effectAllowed = 'move';\n    e.dataTransfer.setData('application/x-merge-list', item.name);\n    e.dataTransfer.setDragImage(head, 12, 12);\n    box.classList.add('dragging');\n  };\n  head.ondragend = () => { mDrag = null; mClearOver(); box.classList.remove('dragging'); };\n  box.ondragover = e => {\n    if (!mDrag) return;\n    e.preventDefault();\n    e.dataTransfer.dropEffect = 'move';\n    mClearOver();\n    if (mDrag !== item) box.classList.add(rightHalf(e) ? 'over-r' : 'over-l');\n  };     h('h1', { textContent: '“' + e.q + '” 주소를 찾을 수 없어요' }),
    h('p', { className: 'lede', textContent: near.length ? '비슷한 기능이 있어요. 골라서 열어 보세요.' : '아래 기능 중에서 골라 주세요.' }),
    h('ul', { className: 'cards' }, ...shown.map(makeCard)),
    back));
  syncStars();
}

function render(opts = {}) {
  const e = entryOf(cur);
  renderTabs();
  const notice = e.type === 'notfound' || (e.type === 'tool' && e.failed);
  $('homeView').hidden = e.type !== 'home';
  $('noticeView').hidden = !notice;
  if (notice) renderNotice(e);
  tabs.forEach(t => t.hist.forEach(x => { if (x.frame) x.frame.hidden = !(x === e && !x.failed); }));
  addr.value = addrOf(e);
  syncToolbar();
  const f = e.frame;
  if (f && !f.hidden) {
    // 숨겨져 있다가 다시 보이면 기능 페이지의 크기 계산을 새로 하게 한다
    requestAnimationFrame(() => { try { f.contentWindow.dispatchEvent(new Event('resize')); } catch (err) {} });
    if (opts.focus) setTimeout(() => { if (entryOf(cur) === e) f.focus(); }, 0);
  }
}

// ───────── 알림 ─────────
let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  $('live').textContent = '';
  setTimeout(() => { $('live').textContent = msg; }, 30);
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

// ───────── 주소창과 자동완성 ─────────
let sugg = [], sel = -1, typed = false;
function openSugg() {
  const q = typed ? parse(addr.value) : '';
  if (!q) {
    const bm = new Set(marks);
    sugg = TOOLS.map(p => ({ p, via: '' })).sort((a, b) => bm.has(b.p.key) - bm.has(a.p.key));
  } else sugg = rank(q).slice(0, 6);
  sel = -1;
  drawSugg();
}
function closeSugg() {
  typed = false; sel = -1;
  list.hidden = true;
  addr.setAttribute('aria-expanded', 'false');
  addr.removeAttribute('aria-activedescendant');
}
function drawSugg() {
  const q = typed ? parse(addr.value) : '';
  const show = document.activeElement === addr && (sugg.length || q);
  list.hidden = !show;
  addr.setAttribute('aria-expanded', String(!!show));
  if (!show) { addr.removeAttribute('aria-activedescendant'); return; }
  if (!sugg.length) { list.replaceChildren(h('li', { className: 'opt empty', textContent: '일치하는 기능이 없어요. Enter를 누르면 비슷한 기능을 보여 드려요.' })); return; }
  list.replaceChildren(...sugg.map((x, i) => {
    const p = x.p;
    const hideVia = !x.via || [p.name, p.slug, p.en].some(s => norm(s) === norm(x.via));
    const li = h('li', { className: 'opt', id: 'opt' + i },
      chip(p),
      h('div', { className: 'opt-name' }, h('span', { textContent: p.name }), ...(hideVia ? [] : [h('span', { className: 'opt-via', textContent: x.via })])),
      ...(marks.includes(p.key) ? [h('span', { className: 'mk' }, ico('star', 14))] : []),
      h('span', { className: 'opt-addr', textContent: p.isHome ? '홈' : p.slug + ' · ' + p.en }));
    if (marks.includes(p.key)) li.querySelector('svg').style.fill = 'currentColor';
    setAttrs(li, { role: 'option', 'aria-selected': String(i === sel) });
    li.onmousedown = ev => ev.preventDefault();               // 입력칸이 포커스를 잃지 않게
    li.onclick = ev => { closeSugg(); addr.blur(); visit(targetOf(p), '', ev.ctrlKey || ev.metaKey); };
    return li;
  }));
  if (sel >= 0) { addr.setAttribute('aria-activedescendant', 'opt' + sel); list.children[sel].scrollIntoView({ block: 'nearest' }); }
  else addr.removeAttribute('aria-activedescendant');
}
// 포커스가 오면 바로 전체 선택한다 (바로 이어서 치는 글자가 덮어쓰이지 않게 지연 없이). 마우스로 눌렀을 때는 놓는 순간 선택이 풀리지 않게 막는다
let clickFocus = false;
addr.addEventListener('mousedown', () => { clickFocus = document.activeElement !== addr; });
addr.addEventListener('mouseup', ev => { if (clickFocus) { ev.preventDefault(); clickFocus = false; } });
addr.addEventListener('focus', () => { typed = false; openSugg(); addr.select(); });
addr.addEventListener('input', () => { typed = true; openSugg(); });
addr.addEventListener('blur', closeSugg);
addr.addEventListener('keydown', ev => {
  if (ev.isComposing || ev.keyCode === 229) return;           // 한글 조합 중의 Enter는 글자 확정이다
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (list.hidden) openSugg();
    if (!sugg.length) return;
    sel = ev.key === 'ArrowDown' ? (sel + 1) % sugg.length : (sel - 1 + sugg.length) % sugg.length;
    drawSugg();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const pick = sel >= 0 ? sugg[sel] : null, raw = addr.value, newTab = ev.altKey;
    closeSugg();
    addr.blur();
    if (pick) visit(targetOf(pick.p), '', newTab);
    else visit(resolve(raw), raw.trim(), newTab);
  } else if (ev.key === 'Escape') {
    if (!list.hidden) closeSugg();
    else { addr.value = addrOf(entryOf(cur)); addr.blur(); }
  }
});

// ───────── 단추 ─────────
$('back').onclick = () => step(-1);
$('fwd').onclick = () => step(1);
$('home').onclick = () => visit({ type: 'home' }, '');
$('star').onclick = () => { const e = entryOf(cur); if (e.type === 'tool') toggleMark(e.tool.key); };
$('newtab').onclick = () => { openTab({ type: 'home' }, '', true); addr.focus(); };

document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'k') { ev.preventDefault(); addr.focus(); }
});
addEventListener('message', ev => {
  const d = ev.data;
  if (!d || typeof d !== 'object') return;
  const f = [...framesEl.children].find(x => x.contentWindow === ev.source);
  if (!f) return;
  if (d.fx === 'ready') { f._ready = true; clearTimeout(f._timer); sendTheme(f); }
  else if (d.fx === 'address') addr.focus();
});
// 기능 페이지는 불러온 직후에도 현재 테마를 받는다
framesEl.addEventListener('load', ev => { if (ev.target.tagName === 'IFRAME') sendTheme(ev.target); }, true);

// ───────── 시작 ─────────
$('cards').replaceChildren(...TOOLS.map(makeCard));
renderMarks();
openTab();
syncStars();
})();
</script>

</body></html>
